[project]
name = "stable-brick-generation"
version = "0.1.0"
description = "Anonymous research code for point-cloud-conditioned stable brick generation"
readme = "README.md"
authors = [
    { name = "Anonymous Authors" }
]
requires-python = ">=3.10"
dependencies = [
    "bpy",
    "gurobipy",
    "numpy<2",
    "peft",
    "torch",
    "transformers",
]

[project.optional-dependencies]
finetuning = [
    "trl",
    "wandb",
]
hub = [
    "huggingface-hub>=0.20",
]

[project.scripts]
infer = "brickgpt.infer:main"
prepare_finetuning_dataset = "brickgpt.prepare_finetuning_dataset:main"
render_bricks = "brickgpt.render_bricks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]
